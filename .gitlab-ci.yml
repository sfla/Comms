stages:
  - build
  - build_release
  - deploy_release

build_linux:
  stage: build
  only:
    - merge_requests
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo build --all
    - cargo test
  tags:
    - linux
  environment: Linux

build_windows:
  stage: build
  only:
    - merge_requests
  script:
    - '$env:Path = "C:\gtk-build-comms\gtk\x64\release\bin;" + $env:Path'
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test
    - cargo build --all
  tags:
    - windows
  environment: Windows

build_release_linux:
  stage: build_release
  only:
    - main
  script:
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test
    - cargo build --all --release
    - sentry-cli releases new "commit-$CI_COMMIT_SHA" --org comms --project comms-app
    - sentry-cli releases set-commits "commit-$CI_COMMIT_SHA" --auto --org comms --project comms-app
    - sentry-cli releases finalize "commit-$CI_COMMIT_SHA" --org comms --project comms-app
  artifacts:
    paths:
      - target/release/audio-cli
      - target/release/comms
      - target/release/comms-server
  tags:
    - linux
  environment: Linux

build_release_windows:
  stage: build_release
  only:
    - main
  script:
    - '$env:Path = "C:\gtk-build-comms\gtk\x64\release\bin;" + $env:Path'
    - if (Test-Path "comms.exe") { rm "comms.exe" }
    - cargo fmt --all -- --check
    - cargo clippy --locked --all-targets --all-features -- -D warnings
    - cargo test
    - cargo build --all --profile release-windows
    - comms/package.ps1 -hide_console -gtk_build_dir C:\gtk-build-comms\gtk\x64\release\
    - comms/sign.ps1
    - sentry-cli upload-dif .\target\release-windows\comms.pdb --org comms --project comms-app --include-sources
  artifacts:
    paths:
      - comms.exe
      - comms-with-console.exe
      - target/release-windows/audio-cli.exe
      - target/release-windows/comms.exe
      - target/release-windows/comms-server.exe
  tags:
    - windows
  environment: Windows

deploy_release:
  stage: deploy_release
  only:
    - main
  script:
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - |-
      sftp comms-ci@getcomms.app <<EOD
      put target/release/comms-server
      EOD
    - |-
      ssh -T comms-ci@getcomms.app <<EOD
      set -ex
      cd /opt/comms
      chmod 774 ~/comms-server
      chown comms-ci:comms ~/comms-server
      mv ~/comms-server .
      sudo /bin/systemctl restart comms.service
      EOD
    - ssh-agent -k
  dependencies:
    - build_release_linux
  environment: Linux
