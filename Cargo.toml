[workspace]
resolver = "2"

members = [
    "audio-device",
    "audio-cli",
    "comms",
    "comms-lib",
    "comms-server",
    "latency-measurement",
    "live-noise-gate-ui",
    "loopback-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Mitchell Hentges <mitch9654@gmail.com>"]

[workspace.lints.clippy]
too_many_arguments = "allow"

[profile.release]
lto = "thin"
debug = true

[profile.dev-linux]
inherits = "dev"
split-debuginfo = "unpacked"

[profile.release-windows]
inherits = "release"
lto = true
codegen-units = 1
split-debuginfo = "packed"
