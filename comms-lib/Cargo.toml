[package]
name = "comms-lib"
version = "0.1.0"
authors = ["Mitchell Hentges <mitch9654@gmail.com>"]
edition = "2021"

[dependencies]
bincode = "1.2"
mio = { version = "0.8", features = ["net", "os-poll"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
thiserror = "1.0.23"
uuid = { version = "1.1.1", features = ["v4", "fast-rng", "serde"]}